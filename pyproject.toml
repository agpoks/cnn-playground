[project]
name = "cnn-playground"
version = "0.1.0"
description = "A playground for CNN architectures: LeNet, AlexNet, VGG, GoogLeNet/Inception, ResNet, DenseNet, MobileNet, Squeeze-and-Excitation, U-Net, a YOLO-style detector, and Vision Transformer (a non-convolutional contrast baseline), with runnable examples, benchmarks, and real datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agpoks", email = "agnespoks2@gmail.com" }]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29"]
docs = ["sphinx>=7.2", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0", "nbsphinx>=0.9", "sphinxcontrib-bibtex>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["cnn_playground*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
